certification_schema:
  description: Schema for cybersecurity certification definitions
  type: object
  required:
    - name
    - vendor
    - difficulty
    - recommended_for
  properties:
    name:
      type: string
      description: Full certification name
      examples:
        - CompTIA Security+
        - eJPT
        - OSCP
    vendor:
      type: string
      description: Organization that issues the certification
      examples:
        - CompTIA
        - INE
        - Offensive Security
        - SANS
    difficulty:
      type: string
      description: Certification difficulty level
      enum:
        - beginner
        - intermediate
        - advanced
    recommended_for:
      type: array
      items:
        type: string
      description: Role names this certification is recommended for
    prerequisites:
      type: array
      items:
        type: string
      description: Skills or certifications required before attempting
      default: []
    exam_cost:
      type: number
      description: Cost of the certification exam in USD
      examples: [404, 1750]
    training_cost:
      type: number
      description: Typical cost of official training/vouchers in USD
      examples: [0, 1600]
    study_hours:
      type: number
      description: Estimated total self-study preparation hours
      examples: [60, 300]
    validity_years:
      type: number
      description: How long the certification remains valid in years
      examples: [3, 4]
    renewal_cost:
      type: number
      description: Annual or 3-year renewal cost in USD
      examples: [0, 150]
